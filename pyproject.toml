[project]
name = "convergence-repro"
version = "0.1.0"
description = "Reproduction of Super-Convergence (Smith & Topin, 2018) on CIFAR-10"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy",
    "matplotlib",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
tensorboard = ["tensorboard"]

[dependency-groups]
dev = ["pytest", "tensorboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convergence_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
